<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="星媛"/>
<meta name="description" content="星媛 AI Agent — 你的专属智能助手"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>星媛 — AI 智能助手</title>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- 全局渐变定义：星标 Logo 五色渐变（红→橙→黄→绿→紫） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="20%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="60%" stop-color="#22c55e"/>
      <stop offset="80%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>

<!-- Auth Screen -->
<div class="screen active" id="authScreen">
  <div class="auth-logo">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z" style="fill:url(#logoGrad);stroke:rgba(255,255,255,.35);stroke-width:0.6"/></svg>
  </div>
  <div class="auth-title">星 媛</div>
  <div class="auth-subtitle">你的专属 AI 智能助手</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="swAt('login')">登录</button>
    <button class="auth-tab" onclick="swAt('reg')">注册</button>
  </div>
  <form class="auth-form" id="loginForm" onsubmit="doLogin(event)">
    <label>用户名</label><input id="lu" type="text" placeholder="输入用户名" required/>
    <label>密码</label><input id="lp" type="password" placeholder="输入密码" required/>
    <button class="btn-primary" type="submit" id="lb">登 录</button>
  </form>
  <form class="auth-form" id="regForm" style="display:none" onsubmit="doReg(event)">
    <label>用户名</label><input id="ru" type="text" placeholder="2-30字符" minlength="2" maxlength="30" required/>
    <label>昵称</label><input id="rn" type="text" placeholder="给自己取个名字"/>
    <label>密码</label><input id="rp" type="password" placeholder="至少8位，含字母和数字" minlength="8" required/>
    <label>确认密码</label><input id="rp2" type="password" placeholder="再次输入" minlength="8" required/>
    <button class="btn-primary" type="submit" id="rb">注 册</button>
  </form>
</div>

<!-- Sidebar Overlay -->
<div class="sb-overlay" id="ov" onclick="closeSb()"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div class="sb-inner">
    <div class="sb-hd">
      <h2>💬 历史会话</h2>
      <button class="btn-i" onclick="closeSb()">
        <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <button class="new-cv" onclick="newChat()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新建对话
    </button>
    <div class="sb-list" id="cvList"></div>
    <div class="sb-menu">
      <div class="m-item" onclick="showMem()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2a4 4 0 0 1 4 4c0 1.2-.5 2.3-1.3 3a4 4 0 0 1 0 6 4 4 0 1 1-5.4-6 4 4 0 0 1 0-6A4 4 0 0 1 12 2z"/><path d="M12 6v12"/></svg>
        星媛的记忆
      </div>
      <div class="m-item" onclick="showWp()">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><path d="M21 15l-5-5-8 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        聊天壁纸
      </div>
      <div class="m-item" onclick="showProfile()">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        个人资料
      </div>
      <div class="m-item logout" onclick="logout()">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出登录
      </div>
    </div>
  </div>
</div>

<!-- Chat Screen -->
<div class="screen" id="chatScreen">
  <div class="app-header">
    <div class="av">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z" style="fill:url(#logoGrad);stroke:rgba(255,255,255,.35);stroke-width:0.6"/></svg>
    </div>
    <div class="hi">
      <div class="hn">星 媛</div>
      <div class="hs" id="sb">
        <svg style="width:8px;height:8px;fill:#22c55e" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3"/></svg>
        在线
      </div>
    </div>
    <span style="font-size:11px;color:var(--text3)" id="ul"></span>
    <button class="btn-i" onclick="openSb()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>
  <div class="msg-list" id="ml">
    <div class="msg-row system">
      <div class="msg-b">
        <svg class="icon" viewBox="0 0 24 24" style="width:28px;height:28px;color:var(--accent);margin-bottom:8px"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/></svg><br>
        你好，我是星媛
      </div>
    </div>
  </div>
  <div class="input-bar">
    <button class="attach-btn" id="abtn" onclick="showImgMenu()" title="发送图片">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><path d="M21 15l-5-5-8 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <div class="input-wrap">
      <div class="img-tray" id="itray"></div>
      <textarea id="inp" rows="1" placeholder="给星媛发消息..." onkeydown="kd(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" id="sbtn" onclick="send()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9"/></svg>
    </button>
  </div>
</div>

<!-- 图片来源菜单（底部弹层） -->
<div class="img-sheet" id="imgMenu">
  <div class="img-menu-item" onclick="pickImgCam()"><svg class="icon" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>拍照</div>
  <div class="img-menu-item" onclick="pickImgGal()"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor" stroke="none"/><path d="M21 15l-5-5-8 8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>从相册选择</div>
  <div class="img-menu-item cancel" onclick="hideImgMenu()">取消</div>
</div>

<div class="toast" id="toast"></div>

<!-- Scripts -->
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // 仅注册。新版本上线不再自动刷新（避免打断对话），
  // 由 app.js 检测到新版本后显示"发现新版本"提示条，用户点击才刷新。
  navigator.serviceWorker.register('/sw.js');
}
</script>
</body>
</html>
