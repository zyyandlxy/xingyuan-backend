<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="星媛"/>
<meta name="description" content="星媛 AI Agent — 你的专属智能助手"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="icon" href="/icon-192.png" type="image/png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>星媛 — AI 智能助手</title>
<link rel="stylesheet" href="css/app.css"/>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>对话历史</h2>
    <button class="btn-icon" onclick="toggleSidebar()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新建对话
  </button>
  <div class="sidebar-list" id="sidebarList"></div>
</div>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Main -->
<header>
  <button class="btn-icon" onclick="toggleSidebar()">
    <svg class="icon" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="logo">
    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/></svg>
  </div>
  <h1>星 媛</h1>
  <span id="modelBadge" style="font-size:12px;color:var(--text3)"></span>
</header>

<div class="messages" id="messages">
  <div class="msg system">
    <div class="msg-bubble">
      <svg class="icon" viewBox="0 0 24 24" style="width:28px;height:28px;color:var(--accent);margin-bottom:8px"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6.4-4.8-6.4 4.8 2.4-7.2-6-4.8h7.6z"/></svg><br>
      你好！我是星媛，基于智谱 AI GLM 驱动。<br>可以聊天、写代码、回答问题。开始对话吧～
    </div>
  </div>
</div>

<div class="input-area">
  <textarea id="input" rows="1" placeholder="输入消息..." onkeydown="onKeyDown(event)" oninput="autoResize()"></textarea>
  <button class="send-btn" id="sendBtn" onclick="send()" title="发送">
    <svg class="icon" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
