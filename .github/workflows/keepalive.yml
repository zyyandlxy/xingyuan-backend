# ═══════════════════════════════════════════
# 星媛 — Render 实例保活
# Render 免费实例闲置约 15 分钟会休眠，下次请求要 30-60s 冷启动。
# 本工作流每 5 分钟 ping 一次 /health，让实例保持清醒，用户打开即用。
# ═══════════════════════════════════════════
name: Keep Render Instance Alive

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟一次，避开整点整分
  workflow_dispatch: {}     # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            https://xingyuan-backend.onrender.com/health || true)
          echo "health_http_code=$code"
          if [ "$code" != "200" ]; then
            echo "::warning::/health 返回 $code，实例可能正在冷启动"
          fi
